name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      # Las pruebas visuales dependen del sistema operativo y se corren en local;
      # las de accesibilidad no, así que se ejecutan aquí.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/accesibilidad.spec.mjs
